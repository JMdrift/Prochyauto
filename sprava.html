<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Správa webu — ProchyAuto</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>

<div class="login" id="login" style="display:none">
  <img src="logo.png" alt="ProchyAuto" style="height:46px;margin-bottom:26px">
  <h2 style="font-size:28px">Správa webu</h2>
  <form class="box" id="loginForm" style="margin-top:20px">
    <label for="pw">Heslo</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit" style="width:100%;margin-top:18px">Přihlásit</button>
    <div id="loginMsg"></div>
  </form>
  <p style="margin-top:18px"><a href="index.html" style="color:var(--muted);font-size:14px">← Zpět na web</a></p>
</div>

<div class="adm" id="app" style="display:none">
  <div class="adm-top">
    <div style="display:flex;align-items:center;gap:14px">
      <img src="logo.png" alt="ProchyAuto">
      <b>Správa webu</b>
    </div>
    <div style="display:flex;gap:10px">
      <a class="del" href="index.html" style="text-decoration:none">Web</a>
      <button class="del" id="logout">Odhlásit</button>
    </div>
  </div>

  <div class="adm-tabs" id="tabs"></div>
  <div id="panel"></div>

  <div class="savebar">
    <button class="btn btn-primary" id="save">Uložit změny</button>
    <span class="status" id="status">Layout webu měnit nelze — jen texty, ceny a fotky.</span>
  </div>
</div>

<input type="file" id="picker" accept="image/jpeg,image/png,image/webp" style="display:none">
<input type="file" id="pickerMulti" accept="image/jpeg,image/png,image/webp" multiple style="display:none">

<script src="admin.js"></script>
</body>
</html>
